name: Zombienet Packages Build Release Manual


# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch

jobs:
  build_release_for_linux:
    name: build_release_for_linux
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
        working-directory: "./javascript"
      - run: npm dedupe
        working-directory: "./javascript"
      - run: npm run build
        working-directory: "./javascript"
      - run: npm run package:linux
        working-directory: "./javascript"
      - run: ls ./bins
        working-directory: "./javascript"
      - name: Test if zombienet-linux runs
        run: ./bins/zombienet-linux-x64 version
        working-directory: "./javascript"
  build_release_for_mac:
    name: build_release_for_mac
    needs: build_release_for_linux
    strategy:
      matrix:
        target:
          - { runner: macos-13, arch: x64 }
          - { runner: macos-14, arch: arm64 }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: "./javascript"
      - run: npm run build
        working-directory: "./javascript"
      - run: npm run package:macos:${{ matrix.target.arch }}
        working-directory: "./javascript"
      - name: Test if zombienet-mac runs
        run: ./bins/zombienet-macos-${{ matrix.target.arch }} version
        working-directory: "./javascript"

      # uncomment to upload the artifacts to the latest release
      # - name: Gets latest created release info
      #   id: latest_release_info
      #   #uses: jossef/action-latest-release-info@v1.2.1
      #   uses: pepoviola/action-latest-release-info@v0.0.2
      #   env:
      #     GITHUB_TOKEN: ${{ github.token }}
      # - name: upload macos artifact
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ github.token }}
      #   with:
      #     upload_url: ${{ steps.latest_release_info.outputs.upload_url }}
      #     asset_path: ./javascript/bins/zombienet-macos-${{ matrix.target.arch }}
      #     asset_name: zombienet-macos-${{ matrix.target.arch }}
      #     asset_content_type: application/octet-stream

  build_push_image:
    name: Build and Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: tags
    env:
      IMAGE_NAME: paritytech/zombienet
      VERSION: v1.3.140
    steps:
      - name: Check out the repo
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v.4.2.0

      - name: npm build
        run: |
          cd javascript
          npm install
          npm dedupe
          npm run clean
          npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          file: ./scripts/ci/docker/zombienet_injected.Dockerfile
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest